<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>{{ .Title }} | {{ .Site.Title }}</title>
<meta name="description" content="{{ .Description }}">
<link rel="canonical" href="{{ .Site.BaseURL }}">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{ .Params.target | relURL }}">
</head>
<body>
<h1>{{ .Title }}</h1>
<p>{{ .Title }} now lives on the <a href="{{ .Params.target | relURL }}">front page</a>.</p>
</body>
</html>
