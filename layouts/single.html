{{ define "main" }}
<article>
  <header>
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "posts" }}
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.tags }} · {{ delimit . ", " }}{{ end }}
    </p>
    {{ end }}
  </header>
  {{ .Content }}
  {{ if eq .Section "posts" }}{{ partial "comments.html" . }}{{ end }}
</article>
{{ end }}
