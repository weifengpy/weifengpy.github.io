baseURL = "https://weifengpy.github.io/"
title = "Wei Feng"
locale = "en-US"
enableGitInfo = true
enableRobotsTXT = true

# Tags are disabled site-wide: no /tags/ index or term pages are generated.
disableKinds = ["taxonomy", "term"]

# Full-content RSS: no item limit.
rssLimit = -1

[params]
  description = "Posts by Wei Feng, a Software Engineer at Meta working on PyTorch distributed training — notes on compilers, LLM inference, and computer architecture."
  author = "Wei Feng"
  tagline = "Notes on compilers, LLM inference, and computer architecture."
  linkedin = "https://www.linkedin.com/in/wei-feng-6740003b"
  email = "fengwei824@gmail.com"
  scholar = "https://scholar.google.com/citations?user=cYrpt1kAAAAJ&hl=en"

  [params.bio]
    en = """
Wei Feng is a Software Engineer at Meta working on PyTorch distributed training

* [FSDP2](https://docs.pytorch.org/tutorials/intermediate/FSDP_tutorial.html): parameters, gradients, and optimizer states sharded across ranks, and support for float8 all-gather, and LoRA/QLoRA
* [FlexShard](https://github.com/meta-pytorch/flex_shard): pluggable sharding placements for Muon optimizer and block-wise quantization
* [TorchTitan](https://github.com/pytorch/torchtitan): PyTorch-native, one-stop platform for production-ready LLM pretraining

Before that Wei worked on recommender systems at Meta and Hulu

* Reels: user-to-item and item-to-item retrieval, improve responsiveness according to in-session engagements
* Newsfeed: diversity re-ranker to ensure calibrated mixture of topics, text, video, and links

He received his PhD from Tsinghua University, advised by [Jianyong Wang](https://dbgroup.cs.tsinghua.edu.cn/wangjy/), was a visiting scholar at UIUC, advised by [Jiawei Han](https://hanj.cs.illinois.edu/). He got bachelor degree in software engineering from Beihang University.
"""
    zh = "冯伟，Meta 软件工程师，从事 PyTorch 分布式训练（FSDP2、FlexShard、TorchTitan；数据并行、Float8 与低精度数据类型）。此前在 Meta 做推荐系统（Reels：召回与响应速度），更早在 Hulu 任 Lead Researcher。博士毕业于清华大学（推荐系统，导师王建勇），期间在 UIUC 做访问学者（韩家炜组），本科毕业于北京航空航天大学软件工程。"

[permalinks]
  [permalinks.page]
    posts = "/posts/:year/:slug/"
  [permalinks.section]
    posts = "/posts/"

[markup]
  [markup.highlight]
    codeFences = true
    noClasses = false
    lineNos = false
    style = "github"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[sitemap]
  changeFreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
